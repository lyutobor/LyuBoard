<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560">
  <style>
    .bg{fill:#FFFFFF}.card{fill:#F6F6F8;stroke:#E4E4EA}.ink{fill:#1C1C22}.soft{fill:#5B5B66}
    .acc{fill:#F28C13}.accline{stroke:#F28C13}.no{fill:#FDF1F1;stroke:#F3D2D2}.nox{fill:#D64545}
    .gain{fill:#FFF6EA;stroke:#F8DDB8}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0D1117}.card{fill:#161B22;stroke:#30363D}.ink{fill:#E6EDF3}.soft{fill:#9DA7B3}
      .no{fill:#1F1416;stroke:#4A2A2E}.nox{fill:#F07070}.gain{fill:#21190F;stroke:#4D3818}
    }
    text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  </style><rect class="bg" width="840" height="560" rx="18"/><text x="30" y="44.0" font-size="21" font-weight="700" class="ink" text-anchor="start">What the Accessibility service in LyuBoard Full does</text><rect class="card" x="30" y="72" width="180" height="142" rx="14"/><circle class="acc" cx="56" cy="98" r="14"/><text x="56" y="103.0" font-size="14" font-weight="700" class="bg" text-anchor="middle">1</text><text x="44" y="136.0" font-size="13.5" font-weight="400" class="ink" text-anchor="start">You open</text><text x="44" y="153.6" font-size="13.5" font-weight="400" class="ink" text-anchor="start">the keyboard</text><path class="accline" d="M213 143 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="232" y="72" width="180" height="142" rx="14"/><circle class="acc" cx="258" cy="98" r="14"/><text x="258" y="103.0" font-size="14" font-weight="700" class="bg" text-anchor="middle">2</text><text x="246" y="136.0" font-size="13.5" font-weight="400" class="ink" text-anchor="start">It asks Android for</text><text x="246" y="153.6" font-size="13.5" font-weight="400" class="ink" text-anchor="start">one picture of the</text><text x="246" y="171.1" font-size="13.5" font-weight="400" class="ink" text-anchor="start">app window under it</text><text x="246" y="188.7" font-size="13.5" font-weight="400" class="ink" text-anchor="start">(Android 14+)</text><path class="accline" d="M415 143 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="434" y="72" width="180" height="142" rx="14"/><circle class="acc" cx="460" cy="98" r="14"/><text x="460" y="103.0" font-size="14" font-weight="700" class="bg" text-anchor="middle">3</text><text x="448" y="136.0" font-size="13.5" font-weight="400" class="ink" text-anchor="start">On the phone it</text><text x="448" y="153.6" font-size="13.5" font-weight="400" class="ink" text-anchor="start">measures the light</text><text x="448" y="171.1" font-size="13.5" font-weight="400" class="ink" text-anchor="start">and keeps a tiny</text><text x="448" y="188.7" font-size="13.5" font-weight="400" class="ink" text-anchor="start">blurred colour copy</text><path class="accline" d="M617 143 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="636" y="72" width="180" height="142" rx="14"/><circle class="acc" cx="662" cy="98" r="14"/><text x="662" y="103.0" font-size="14" font-weight="700" class="bg" text-anchor="middle">4</text><text x="650" y="136.0" font-size="13.5" font-weight="400" class="ink" text-anchor="start">The picture is</text><text x="650" y="153.6" font-size="13.5" font-weight="400" class="ink" text-anchor="start">deleted at once:</text><text x="650" y="171.1" font-size="13.5" font-weight="400" class="ink" text-anchor="start">nothing saved,</text><text x="650" y="188.7" font-size="13.5" font-weight="400" class="ink" text-anchor="start">nothing sent</text><text x="30" y="250.0" font-size="16" font-weight="700" class="ink" text-anchor="start">What you get</text><rect class="gain" x="30.0" y="264" width="248.0" height="92" rx="14"/><text x="46.0" y="294.0" font-size="13.5" font-weight="400" class="ink" text-anchor="start">Light keyboard over a light</text><text x="46.0" y="311.6" font-size="13.5" font-weight="400" class="ink" text-anchor="start">app, dark over a dark one</text><rect class="gain" x="296.0" y="264" width="248.0" height="92" rx="14"/><text x="312.0" y="294.0" font-size="13.5" font-weight="400" class="ink" text-anchor="start">The app's blurred colours</text><text x="312.0" y="311.6" font-size="13.5" font-weight="400" class="ink" text-anchor="start">under the glass, where it</text><text x="312.0" y="329.1" font-size="13.5" font-weight="400" class="ink" text-anchor="start">draws nothing itself</text><rect class="gain" x="562.0" y="264" width="248.0" height="92" rx="14"/><text x="578.0" y="294.0" font-size="13.5" font-weight="400" class="ink" text-anchor="start">Denser glass over busy</text><text x="578.0" y="311.6" font-size="13.5" font-weight="400" class="ink" text-anchor="start">backgrounds, so letters</text><text x="578.0" y="329.1" font-size="13.5" font-weight="400" class="ink" text-anchor="start">stay readable</text><text x="30" y="392.0" font-size="16" font-weight="700" class="ink" text-anchor="start">What it never does</text><rect class="no" x="30" y="406" width="780" height="104" rx="14"/><path d="M47 427 l10 10 m0 -10 l-10 10" class="accline" style="stroke:#D64545" stroke-width="2.4" stroke-linecap="round"/><text x="68" y="436.0" font-size="14" font-weight="400" class="ink" text-anchor="start">Read the text on your screen</text><path d="M437 427 l10 10 m0 -10 l-10 10" class="accline" style="stroke:#D64545" stroke-width="2.4" stroke-linecap="round"/><text x="458" y="436.0" font-size="14" font-weight="400" class="ink" text-anchor="start">Tap, type or press anything for you</text><path d="M47 457 l10 10 m0 -10 l-10 10" class="accline" style="stroke:#D64545" stroke-width="2.4" stroke-linecap="round"/><text x="68" y="466.0" font-size="14" font-weight="400" class="ink" text-anchor="start">Save pictures to files</text><path d="M437 457 l10 10 m0 -10 l-10 10" class="accline" style="stroke:#D64545" stroke-width="2.4" stroke-linecap="round"/><text x="458" y="466.0" font-size="14" font-weight="400" class="ink" text-anchor="start">Send anything to the internet</text><path d="M47 487 l10 10 m0 -10 l-10 10" class="accline" style="stroke:#D64545" stroke-width="2.4" stroke-linecap="round"/><text x="68" y="496.0" font-size="14" font-weight="400" class="ink" text-anchor="start">Listen to accessibility events</text><path d="M437 487 l10 10 m0 -10 l-10 10" class="accline" style="stroke:#D64545" stroke-width="2.4" stroke-linecap="round"/><text x="458" y="496.0" font-size="14" font-weight="400" class="ink" text-anchor="start">Do anything while the keyboard is closed</text><text x="30" y="542.0" font-size="12.5" font-weight="400" class="soft" text-anchor="start">Off by default. Turn it on or off any time in Settings → Accessibility → Installed apps.</text></svg>